; ==========================
; Configuración PHP para WordPress
; ==========================

; ----------------------------------------
; Límites de subida y memoria
; ----------------------------------------
upload_max_filesize = 64M        ; Tamaño máximo de un archivo subido
post_max_size = 64M              ; Tamaño máximo de datos enviados por formularios
memory_limit = 256M              ; Memoria máxima que puede usar PHP
max_execution_time = 300         ; Tiempo máximo de ejecución de un script
max_input_time = 300             ; Tiempo máximo para procesar datos de entrada
max_input_vars = 300             ; Número máximo de variables por formulario

; ----------------------------------------
; Errores y logs
; ----------------------------------------
display_errors = On              ; Mostrar errores (solo desarrollo)
log_errors = On                  ; Guardar errores en logs
error_log = /var/log/php_errors.log

; ----------------------------------------
; Seguridad
; ----------------------------------------
cgi.fix_pathinfo = 0             ; Evita ataques de path traversal
expose_php = Off                 ; No mostrar versión de PHP

; ----------------------------------------
; Zona horaria
; ----------------------------------------
date.timezone = Europe/Madrid
