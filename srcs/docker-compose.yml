version: "3.8" # 3.8 es estable y compatible con Docker moderno

# Definición de servicios
# Cada servicio = 1 contenedor
services:

  # MariaDB (Base de datos), guarda datos
  mariadb:
    # Construye la imagen desde esta ruta
    # No se usan imágenes prehechas
    build: ./requirements/mariadb

    # Nombre fijo del contenedor
    container_name: mariadb

    # Reinicia el contenedor si se cae (excepto si se para manualmente)
    restart: unless-stopped

    # Archivo con variables de entorno NO sensibles
    env_file:
      - .env

    # Docker secrets
    secrets:
      - db_root_password
      - db_user_password

    # Volumen persistente para la base de datos
    # Aunque se borre el contenedor, los datos siguen
    volumes:
      - mariadb_data:/var/lib/mysql

    # Red interna del proyecto
    networks:
      - inception

    # Puerto expuesto SOLO a la red interna
    # No accesible desde el host
    expose:
      - "3306"

  # WordPress (PHP-FPM), crea la web
  wordpress:
    # Imagen propia construida desde Dockerfile
    build: ./requirements/wordpress

    container_name: wordpress

    restart: unless-stopped

    # WordPress depende de que MariaDB esté disponible
    depends_on:
      - mariadb

    # Variables de entorno no sensibles
    env_file:
      - .env

    # Secrets necesarios para conectar con MariaDB
    # y crear el usuario admin de WordPress
    secrets:
      - db_user_password
      - db_root_password
      - wp_admin_password

    # Volumen compartido con NGINX
    # Contiene WordPress, uploads, plugins, temas, etc.
    volumes:
      - wordpress_data:/var/www/html

    # Red interna
    networks:
      - inception

    # Puerto de PHP-FPM
    # SOLO accesible por NGINX
    expose:
      - "9000"

  # NGINX (Servidor web), muestra la web al mundo
  nginx:
    # Imagen propia con NGINX + TLS
    build: ./requirements/nginx

    container_name: nginx

    restart: unless-stopped

    # NGINX depende de WordPress (PHP-FPM)
    depends_on:
      - wordpress

    # Variables de entorno (ej: DOMAIN_NAME)
    env_file:
      - .env

    # Certificados TLS como Docker secrets
    secrets:
      - nginx_crt
      - nginx_key

    # Volumen compartido para servir WordPress
    volumes:
      - wordpress_data:/var/www/html

    # Red interna
    networks:
      - inception

    # ÚNICO puerto expuesto al exterior
    # HTTPS obligatorio (subject)
    ports:
      - "443:443"

# Volúmenes persistentes
volumes:
  # Datos de MariaDB
  mariadb_data:
    driver: local

  # Archivos de WordPress
  wordpress_data:
    driver: local

networks:
  inception:
    driver: bridge

# Aqui le estamos diciendo que la red Inception( que es el nombre que le pusimos y podiamos cambiar),
# para network va a ser de tipo bridge, que se llama usando driver.
# Ese tipo de red te permite que los contenerdores que tengan la network inception se puedan comunicar entre ellos,
# pero que no se ven desde fuera.

# Pero su comunicación y su dependencia y sincronización se maneja en los sripts (.sh).

# MariaDB arranca, se inicializa, se queda escuchando, no espera a nadie.
# Wordpress no hace nada hasta que MariaDB responda
# Nginx espera a que wordpress tenga los archivos y uego arranca.

secrets:
  # Contraseña root de MariaDB
  db_root_password:
    file: ./secrets/db_root_password.txt

  # Contraseña del usuario de WordPress en la BD
  db_user_password:
    file: ./secrets/db_user_password.txt

  # Contraseña del admin de WordPress
  wp_admin_password:
    file: ./secrets/wp_admin_password.txt

  # Certificado TLS de NGINX
  nginx_crt:
    file: ./secrets/nginx.crt

  # Clave privada TLS de NGINX
  nginx_key:
    file: ./secrets/nginx.key


# Se utiliza build porque Inception prohíbe imágenes preconstruidas
# y es una herrameinta que siguiendo la ruta que se le da, busca el Dockerfile ahí dentro.
# Sabe que tiene que buscar Dockerfile por que es una regla fija que tiene Docker.
# build busca Dockerfile, al igual que make busca Makefile

# Se utiliza restart para reiniciar el contenedor.
# y unless-stopped es la regla interna de Docker que dice,
# si el contenedor se detiene por un fallo, Docker lo reinicia automáticamente, 
# o si el contenedor se detiene porque yo lo paro manualmente, Docker no lo reinicia

# Se utiliza volumes para guardar todo lo que ejecuta y hace mariadb dentro de esta direccion
# - mariadb_data:/var/lib/mysql,
# para no perderlo y que los datos permanecen aunque el contenedor muera o se reinicie

# Network es una red interna para que los diferentes contendeores se puedan comunicar entre si.
# Cada uno con su respectivo expone o ports.
# Donde expose es un puerto solo visible dentro de la red, para que otros contenedores lo usen
# y ports es un puerto visible al mundo exterior, el usuario puede conectarse
# Pero para eso todos tienen que tener el mismo networks